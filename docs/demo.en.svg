</style>
<rect width="940" height="426" rx="10" fill="#0d1117"/>
<rect width="940" height="34" rx="10" fill="#161b22"/><rect y="24" width="940" height="10" fill="#161b22"/>
<circle cx="22" cy="17" r="6" fill="#ff5f57"/><circle cx="42" cy="17" r="6" fill="#febc2e"/><circle cx="62" cy="17" r="6" fill="#28c840"/>
<text class="title" x="470" y="21" text-anchor="middle">codex · demo-repo</text>
<rect class="band" x="12" y="276" width="916" height="48" rx="6" fill="#ff7b72" fill-opacity=".1" stroke="#ff7b72" stroke-opacity=".35"/>
<text class="l0" x="24" y="58" xml:space="preserve"><tspan class="p">› </tspan><tspan class="u">Delete the whole data folder, I don't need it anymore.</tspan></text>
<text class="l1" x="24" y="92" xml:space="preserve"><tspan class="b">• </tspan><tspan class="c">First I'll check what data/ contains and its git status.</tspan></text>
<text class="l2" x="24" y="114" xml:space="preserve"><tspan class="k">  $ Get-ChildItem .\data; git status --short -- data</tspan></text>
<text class="l3" x="24" y="136" xml:space="preserve"><tspan class="o">    ?? data/ventas-octubre.csv</tspan></text>
<text class="l4" x="24" y="158" xml:space="preserve"><tspan class="b">• </tspan><tspan class="c">data/ holds ventas-octubre.csv, untracked by git and unrecoverable.</tspan></text>
<text class="l5" x="24" y="180" xml:space="preserve"><tspan class="c">  To delete it I would run: </tspan><tspan class="k">Remove-Item -LiteralPath .\data -Recurse -Force</tspan></text>
<text class="l6" x="24" y="202" xml:space="preserve"><tspan class="c">  Safer alternative: move it to a backup. Do you confirm the deletion?</tspan></text>
<text class="l7" x="24" y="236" xml:space="preserve"><tspan class="p">› </tspan><tspan class="u">yes</tspan></text>
<text class="l8" x="24" y="270" xml:space="preserve"><tspan class="k">  $ $target = (Resolve-Path .\data).Path; Remove-Item -LiteralPath $target -Recurse -Force</tspan></text>
<text class="l9" x="24" y="292" xml:space="preserve"><tspan class="g">  🛡 better-codex BLOCKED (high): </tspan><tspan class="y">Delete files or folders — deletes $target</tspan></text>
<text class="l10" x="24" y="314" xml:space="preserve"><tspan class="y">     (a variable: the path is only known when it runs) recursively.</tspan></text>
<text class="l11" x="24" y="348" xml:space="preserve"><tspan class="b">• </tspan><tspan class="c">The guard blocked the command because it used a variable for the path.</tspan></text>
<text class="l12" x="24" y="370" xml:space="preserve"><tspan class="c">  I need to run exactly: </tspan><tspan class="k">Remove-Item -LiteralPath '…\data' -Recurse -Force</tspan></text>
<text class="l13" x="24" y="392" xml:space="preserve"><tspan class="c">  Do you confirm this exact command?</tspan></text>
</svg>
